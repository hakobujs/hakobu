name: Build Base Binaries

# Build patched Node v24.14.0 base binaries for all alpha-required targets.
# See docs/target-policy.md for the full target matrix and verification rules.
# See docs/release-contract.md for artifact naming and checksum format.
#
# This workflow is CI proof — it builds, verifies, and uploads artifacts.
# It does NOT publish GitHub Releases (that is Task 13 scope).
#
# Alpha-required targets (must be green):
#   Tier 1: linux-x64, linux-arm64, win-x64, macos-arm64
#   Tier 2: macos-x64, linuxstatic-x64
#
# Blocked targets (explicitly excluded):
#   linuxstatic-arm64: muslcc GCC too old for Node 24 deps/ada/ada.h
#                      C++20 constexpr (see docs/target-policy.md)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/hakobu-fetch/**"
      - ".github/workflows/build-bases.yml"

env:
  NODE_RANGE: node24
  NODE_VERSION: v24.14.0

concurrency:
  group: build-bases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Native builds — macOS (arm64, x64) and Windows (x64)
  # Build pipeline deps are installed via pnpm (frozen lockfile).
  # No Docker needed — builds run directly on the runner.
  # ─────────────────────────────────────────────────────────────────────
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-latest
            platform: macos
            arch: arm64
            tier: 1
            artifact: hakobu-base-v24.14.0-macos-arm64

          - target: macos-x64
            os: macos-latest
            platform: macos
            arch: x64
            tier: 2
            artifact: hakobu-base-v24.14.0-macos-x64

          - target: win-x64
            os: windows-latest
            platform: win
            arch: x64
            tier: 1
            artifact: hakobu-base-v24.14.0-win-x64

    name: "${{ matrix.target }} (Tier ${{ matrix.tier }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build hakobu-fetch TypeScript
        run: pnpm --filter @hakobu/hakobu-fetch build

      - name: Build patched Node base binary
        working-directory: packages/hakobu-fetch
        shell: bash
        run: >
          node lib-es5/bin.js
          --node-range ${{ env.NODE_RANGE }}
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --force-build
          --output dist

      # ── macos-x64 Rosetta gate ──
      - name: Check Rosetta availability (macos-x64 only)
        if: matrix.target == 'macos-x64'
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::error::Rosetta 2 is not available on this runner."
            exit 1
          fi
          echo "Rosetta 2: available"

      - name: Verify — version + bytecode
        working-directory: packages/hakobu-fetch
        shell: bash
        run: |
          binary="dist/node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}"

          run_prefix=""
          if [ "${{ matrix.target }}" = "macos-x64" ]; then
            run_prefix="arch -x86_64"
          fi

          echo "::group::Binary info"
          ls -lh "$binary"
          file "$binary" || true
          echo "::endgroup::"

          echo "::group::Version + ABI check"
          PKG_EXECPATH=PKG_INVOKE_NODEJS $run_prefix "$binary" -e "
            var assert = require('assert');
            var v = process.version;
            var m = process.versions.modules;
            console.log('version:', v, '  ABI:', m, '  arch:', process.arch);
            assert(v.startsWith('v24.'), 'Expected v24.x, got ' + v);
            assert(m === '137', 'Expected ABI 137, got ' + m);
            console.log('version-check: PASS');
          "
          echo "::endgroup::"

          echo "::group::V8 bytecode (sourceless cachedData)"
          PKG_EXECPATH=PKG_INVOKE_NODEJS $run_prefix "$binary" -e "
            var vm = require('vm');
            var assert = require('assert');
            var text = '(function () { return 42; })';
            var s1 = new vm.Script(text, { filename: 's1', produceCachedData: true, sourceless: true });
            assert(s1.cachedDataProduced, 's1.cachedDataProduced');
            var s2 = new vm.Script(undefined, { filename: 's2', cachedData: s1.cachedData, sourceless: true });
            assert.equal(s2.runInThisContext()(), 42, 'sourceless result');
            var s3 = new vm.Script(text, { filename: 's3', produceCachedData: true });
            assert(s3.cachedDataProduced, 's3.cachedDataProduced');
            console.log('bytecode-verify: PASS');
          "
          echo "::endgroup::"

      - name: Rename to release contract name
        working-directory: packages/hakobu-fetch
        shell: bash
        run: mv "dist/node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}" "${{ matrix.artifact }}"

      - name: Compute SHA-256
        working-directory: packages/hakobu-fetch
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "${{ matrix.artifact }}" | tee "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" | tee "${{ matrix.artifact }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/hakobu-fetch/${{ matrix.artifact }}*
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Docker-based Linux x64 builds
  #
  # TypeScript is pre-built on the CI runner using pnpm (frozen lockfile)
  # for deterministic compilation. Docker receives the pre-built lib-es5/
  # and only installs production runtime deps (pure-JS packages that do
  # not affect the output binary).
  #
  # linux-x64: OracleLinux 8 (glibc 2.28 for broad compat)
  # linuxstatic-x64: Alpine 3.22 (musl, fully static binary)
  # ─────────────────────────────────────────────────────────────────────
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            platform: linux
            arch: x64
            tier: 1
            dockerfile: Dockerfile.linux
            extra_build_args: ""
            artifact: hakobu-base-v24.14.0-linux-x64

          - target: linuxstatic-x64
            platform: linuxstatic
            arch: x64
            tier: 2
            dockerfile: Dockerfile.alpine
            extra_build_args: >-
              --build-arg HAKOBU_FETCH_OPTION_p=linuxstatic
              --build-arg HAKOBU_FETCH_OPTION_a=x64
            artifact: hakobu-base-v24.14.0-linuxstatic-x64

    name: "${{ matrix.target }} (Tier ${{ matrix.tier }})"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      # Pre-build TypeScript on the runner for deterministic compilation.
      # This uses pnpm --frozen-lockfile so deps are pinned by the
      # workspace lockfile. The resulting lib-es5/ is copied into Docker.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Pre-build hakobu-fetch TypeScript
        run: pnpm --filter @hakobu/hakobu-fetch build

      - name: Build in Docker
        run: |
          docker build \
            -f packages/hakobu-fetch/${{ matrix.dockerfile }} \
            -t hakobu-fetch-${{ matrix.target }} \
            --build-arg HAKOBU_FETCH_OPTION_n=${{ env.NODE_RANGE }} \
            ${{ matrix.extra_build_args }} \
            packages/hakobu-fetch

      - name: Extract binary from container
        run: |
          id=$(docker create hakobu-fetch-${{ matrix.target }})
          docker cp "$id:/." ./docker-out/
          docker rm "$id"
          ls -lh docker-out/

      - name: Verify — version + bytecode
        run: |
          binary="docker-out/node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}"
          chmod +x "$binary"

          echo "::group::Binary info"
          ls -lh "$binary"
          file "$binary"
          echo "::endgroup::"

          echo "::group::Version + ABI check"
          PKG_EXECPATH=PKG_INVOKE_NODEJS "$binary" -e "
            var assert = require('assert');
            var v = process.version;
            var m = process.versions.modules;
            console.log('version:', v, '  ABI:', m, '  arch:', process.arch);
            assert(v.startsWith('v24.'), 'Expected v24.x, got ' + v);
            assert(m === '137', 'Expected ABI 137, got ' + m);
            console.log('version-check: PASS');
          "
          echo "::endgroup::"

          echo "::group::V8 bytecode (sourceless cachedData)"
          PKG_EXECPATH=PKG_INVOKE_NODEJS "$binary" -e "
            var vm = require('vm');
            var assert = require('assert');
            var text = '(function () { return 42; })';
            var s1 = new vm.Script(text, { filename: 's1', produceCachedData: true, sourceless: true });
            assert(s1.cachedDataProduced, 's1.cachedDataProduced');
            var s2 = new vm.Script(undefined, { filename: 's2', cachedData: s1.cachedData, sourceless: true });
            assert.equal(s2.runInThisContext()(), 42, 'sourceless result');
            var s3 = new vm.Script(text, { filename: 's3', produceCachedData: true });
            assert(s3.cachedDataProduced, 's3.cachedDataProduced');
            console.log('bytecode-verify: PASS');
          "
          echo "::endgroup::"

      - name: Rename to release contract name
        run: mv "docker-out/node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}" "${{ matrix.artifact }}"

      - name: Compute SHA-256
        run: sha256sum "${{ matrix.artifact }}" | tee "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Docker cross-compiled linux-arm64
  #
  # Cross-compiled on x64 via gcc-12-aarch64-linux-gnu.
  # Verification inside an arm64 Ubuntu container via QEMU binfmt_misc.
  # Alpha-acceptable per docs/target-policy.md — native arm64 runner
  # required by beta.
  #
  # NOTE: linuxstatic-arm64 is excluded from this workflow.
  # The muslcc/x86_64:aarch64-linux-musl cross-compiler's GCC cannot
  # compile Node 24's deps/ada/ada.h (C++20 constexpr incompatibility).
  # This target is Tier 2 / best-effort and is not blocking for alpha.
  # It will be re-enabled when a newer musl cross-toolchain is available
  # or when native arm64 Alpine builds become feasible.
  # ─────────────────────────────────────────────────────────────────────
  build-linux-cross:
    name: "linux-arm64 (Tier 1)"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Pre-build TypeScript on the runner (deterministic).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Pre-build hakobu-fetch TypeScript
        run: pnpm --filter @hakobu/hakobu-fetch build

      - name: Build in Docker (cross-compile)
        run: |
          docker build \
            -f packages/hakobu-fetch/Dockerfile.linuxcross \
            -t hakobu-fetch-linux-arm64 \
            --build-arg HAKOBU_FETCH_OPTION_n=${{ env.NODE_RANGE }} \
            --build-arg HAKOBU_FETCH_OPTION_a=arm64 \
            --build-arg TARGET_TOOLCHAIN_ARCH=aarch64 \
            packages/hakobu-fetch

      - name: Extract binary from container
        run: |
          id=$(docker create hakobu-fetch-linux-arm64)
          docker cp "$id:/." ./docker-out/
          docker rm "$id"
          ls -lh docker-out/

      - name: Verify — version + bytecode (arm64 container via QEMU)
        run: |
          binary="node-${{ env.NODE_VERSION }}-linux-arm64"
          chmod +x "docker-out/$binary"

          echo "Verification: arm64 container (ubuntu:jammy) via QEMU binfmt_misc"
          echo "Policy: alpha-acceptable, see docs/target-policy.md"

          echo "::group::Binary info"
          file "docker-out/$binary"
          echo "::endgroup::"

          echo "::group::Version + ABI check (arm64 container)"
          docker run --rm --platform linux/arm64 \
            -v "$(pwd)/docker-out:/work:ro" \
            -e PKG_EXECPATH=PKG_INVOKE_NODEJS \
            ubuntu:jammy \
            /work/$binary -e "
              var assert = require('assert');
              var v = process.version;
              var m = process.versions.modules;
              console.log('version:', v, '  ABI:', m, '  arch:', process.arch);
              assert(v.startsWith('v24.'), 'Expected v24.x, got ' + v);
              assert(m === '137', 'Expected ABI 137, got ' + m);
              console.log('version-check: PASS (arm64 container via QEMU)');
            "
          echo "::endgroup::"

          echo "::group::V8 bytecode (arm64 container)"
          docker run --rm --platform linux/arm64 \
            -v "$(pwd)/docker-out:/work:ro" \
            -e PKG_EXECPATH=PKG_INVOKE_NODEJS \
            ubuntu:jammy \
            /work/$binary -e "
              var vm = require('vm');
              var assert = require('assert');
              var text = '(function () { return 42; })';
              var s1 = new vm.Script(text, { filename: 's1', produceCachedData: true, sourceless: true });
              assert(s1.cachedDataProduced, 's1.cachedDataProduced');
              var s2 = new vm.Script(undefined, { filename: 's2', cachedData: s1.cachedData, sourceless: true });
              assert.equal(s2.runInThisContext()(), 42, 'sourceless result');
              var s3 = new vm.Script(text, { filename: 's3', produceCachedData: true });
              assert(s3.cachedDataProduced, 's3.cachedDataProduced');
              console.log('bytecode-verify: PASS (arm64 container via QEMU)');
            "
          echo "::endgroup::"

      - name: Rename to release contract name
        run: mv "docker-out/node-${{ env.NODE_VERSION }}-linux-arm64" "hakobu-base-v24.14.0-linux-arm64"

      - name: Compute SHA-256
        run: sha256sum "hakobu-base-v24.14.0-linux-arm64" | tee "hakobu-base-v24.14.0-linux-arm64.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hakobu-base-v24.14.0-linux-arm64
          path: hakobu-base-v24.14.0-linux-arm64*
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Aggregate all checksums
  # ─────────────────────────────────────────────────────────────────────
  checksums:
    name: Collect checksums
    needs: [build-native, build-linux, build-linux-cross]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate combined CHECKSUMS.sha256
        run: |
          {
            echo "# Hakobu patched base binaries — Node ${{ env.NODE_VERSION }}"
            echo "# Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "#"
            echo "# Alpha targets (linuxstatic-arm64 excluded — blocked by toolchain)"
            echo ""
            find artifacts -name '*.sha256' -exec cat {} + | sort -k2
          } > CHECKSUMS.sha256

      - name: Display checksums
        run: cat CHECKSUMS.sha256

      - name: Upload combined checksums
        uses: actions/upload-artifact@v4
        with:
          name: CHECKSUMS
          path: CHECKSUMS.sha256
          retention-days: 30
