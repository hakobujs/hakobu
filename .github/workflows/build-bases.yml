name: Build Base Binaries

# Build patched Node v24.14.0 base binaries for all alpha-required targets.
# See docs/target-policy.md for the full target matrix and verification rules.
# See docs/release-contract.md for artifact naming and checksum format.
#
# Two modes:
#   CI validation (default): build + verify + upload artifacts
#   Publish release:         CI validation + GitHub Release at bases/node-v24.14.0
#     Triggered via workflow_dispatch with publish_release=true
#
# Alpha-required targets (must be green):
#   Tier 1: linux-x64, linux-arm64, win-x64, macos-arm64
#   Tier 2: macos-x64, linuxstatic-x64, win-arm64
#
# Blocked targets (explicitly excluded):
#   linuxstatic-arm64: muslcc GCC too old for Node 24 deps/ada/ada.h
#
# Build strategy by target:
#   NATIVE RUNNERS:
#     macos-arm64:  native build + native verify on macos-latest (arm64)
#     macos-x64:    cross-build + Rosetta verify on macos-latest (arm64)
#     win-x64:      native build + native verify on windows-latest
#     win-arm64:    native build + native verify on windows-11-arm
#   DOCKER BUILDS (intentional — for glibc/musl output compatibility):
#     linux-x64:         OracleLinux 8 Docker on ubuntu-latest (glibc 2.28)
#     linux-arm64:       OracleLinux 8 Docker on ubuntu-24.04-arm (native arm64)
#     linuxstatic-x64:   Alpine 3.22 Docker on ubuntu-latest (musl, fully static)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release after successful build"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "packages/hakobu-fetch/patches/**"
      - "packages/hakobu-fetch/Dockerfile.*"
      - "packages/hakobu-fetch/scripts/**"
      - "packages/hakobu-fetch/PROVENANCE.json"
      - "packages/hakobu-fetch/shas.txt"
      - "packages/hakobu-fetch/lib/expected-shas.json"
      - ".github/workflows/build-bases.yml"

env:
  NODE_RANGE: node24
  NODE_VERSION: v24.14.0
  RELEASE_TAG: bases/node-v24.14.0

concurrency:
  group: build-bases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Native runner builds — macOS (arm64, x64) and Windows (x64)
  # ─────────────────────────────────────────────────────────────────────
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-latest
            platform: macos
            arch: arm64
            tier: 1
            artifact: hakobu-base-v24.14.0-macos-arm64

          - target: macos-x64
            os: macos-latest
            platform: macos
            arch: x64
            tier: 2
            artifact: hakobu-base-v24.14.0-macos-x64

          - target: win-x64
            os: windows-latest
            platform: win
            arch: x64
            tier: 1
            artifact: hakobu-base-v24.14.0-win-x64

          - target: win-arm64
            os: windows-11-arm
            platform: win
            arch: arm64
            tier: 2
            artifact: hakobu-base-v24.14.0-win-arm64

    name: "${{ matrix.target }} (Tier ${{ matrix.tier }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build hakobu-fetch TypeScript
        run: pnpm --filter @hakobu/hakobu-fetch build

      - name: Build patched Node base binary
        working-directory: packages/hakobu-fetch
        shell: bash
        run: >
          node lib-es5/bin.js
          --node-range ${{ env.NODE_RANGE }}
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --force-build
          --output dist

      - name: Check Rosetta availability (macos-x64 only)
        if: matrix.target == 'macos-x64'
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::error::Rosetta 2 is not available on this runner."
            exit 1
          fi
          echo "Rosetta 2: available"

      - name: Verify — version + bytecode
        working-directory: packages/hakobu-fetch
        shell: bash
        run: |
          binary="dist/node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}"
          run_prefix=""
          if [ "${{ matrix.target }}" = "macos-x64" ]; then
            run_prefix="arch -x86_64"
          fi

          echo "::group::Binary info"
          ls -lh "$binary"
          file "$binary" || true
          echo "::endgroup::"

          echo "::group::Version + ABI check"
          PKG_EXECPATH=PKG_INVOKE_NODEJS $run_prefix "$binary" -e "
            var assert = require('assert');
            var v = process.version;
            var m = process.versions.modules;
            console.log('version:', v, '  ABI:', m, '  arch:', process.arch);
            assert(v.startsWith('v24.'), 'Expected v24.x, got ' + v);
            assert(m === '137', 'Expected ABI 137, got ' + m);
            console.log('version-check: PASS');
          "
          echo "::endgroup::"

          echo "::group::V8 bytecode (sourceless cachedData)"
          PKG_EXECPATH=PKG_INVOKE_NODEJS $run_prefix "$binary" -e "
            var vm = require('vm');
            var assert = require('assert');
            var text = '(function () { return 42; })';
            var s1 = new vm.Script(text, { filename: 's1', produceCachedData: true, sourceless: true });
            assert(s1.cachedDataProduced, 's1.cachedDataProduced');
            var s2 = new vm.Script(undefined, { filename: 's2', cachedData: s1.cachedData, sourceless: true });
            assert.equal(s2.runInThisContext()(), 42, 'sourceless result');
            var s3 = new vm.Script(text, { filename: 's3', produceCachedData: true });
            assert(s3.cachedDataProduced, 's3.cachedDataProduced');
            console.log('bytecode-verify: PASS');
          "
          echo "::endgroup::"

      - name: Rename to release contract name
        working-directory: packages/hakobu-fetch
        shell: bash
        run: mv "dist/node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}" "${{ matrix.artifact }}"

      - name: Compute SHA-256
        working-directory: packages/hakobu-fetch
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "${{ matrix.artifact }}" | tee "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" | tee "${{ matrix.artifact }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/hakobu-fetch/${{ matrix.artifact }}*
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Docker-based Linux builds (intentional — for output compatibility)
  # ─────────────────────────────────────────────────────────────────────
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            tier: 1
            dockerfile: Dockerfile.linux
            extra_build_args: ""
            artifact: hakobu-base-v24.14.0-linux-x64

          - target: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            tier: 1
            dockerfile: Dockerfile.linux
            extra_build_args: ""
            artifact: hakobu-base-v24.14.0-linux-arm64

          - target: linuxstatic-x64
            os: ubuntu-latest
            platform: linuxstatic
            arch: x64
            tier: 2
            dockerfile: Dockerfile.alpine
            extra_build_args: >-
              --build-arg HAKOBU_FETCH_OPTION_p=linuxstatic
              --build-arg HAKOBU_FETCH_OPTION_a=x64
            artifact: hakobu-base-v24.14.0-linuxstatic-x64

    name: "${{ matrix.target }} (Tier ${{ matrix.tier }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Pre-build hakobu-fetch TypeScript
        run: pnpm --filter @hakobu/hakobu-fetch build

      - name: Build in Docker and extract binary
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f packages/hakobu-fetch/${{ matrix.dockerfile }} \
            --output type=local,dest=docker-out \
            --build-arg HAKOBU_FETCH_OPTION_n=${{ env.NODE_RANGE }} \
            ${{ matrix.extra_build_args }} \
            packages/hakobu-fetch
          ls -lh docker-out/

      - name: Verify — version + bytecode
        run: |
          binary="docker-out/node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}"
          chmod +x "$binary"

          echo "::group::Binary info"
          ls -lh "$binary"
          file "$binary"
          echo "::endgroup::"

          echo "::group::Version + ABI check"
          PKG_EXECPATH=PKG_INVOKE_NODEJS "$binary" -e "
            var assert = require('assert');
            var v = process.version;
            var m = process.versions.modules;
            console.log('version:', v, '  ABI:', m, '  arch:', process.arch);
            assert(v.startsWith('v24.'), 'Expected v24.x, got ' + v);
            assert(m === '137', 'Expected ABI 137, got ' + m);
            console.log('version-check: PASS');
          "
          echo "::endgroup::"

          echo "::group::V8 bytecode (sourceless cachedData)"
          PKG_EXECPATH=PKG_INVOKE_NODEJS "$binary" -e "
            var vm = require('vm');
            var assert = require('assert');
            var text = '(function () { return 42; })';
            var s1 = new vm.Script(text, { filename: 's1', produceCachedData: true, sourceless: true });
            assert(s1.cachedDataProduced, 's1.cachedDataProduced');
            var s2 = new vm.Script(undefined, { filename: 's2', cachedData: s1.cachedData, sourceless: true });
            assert.equal(s2.runInThisContext()(), 42, 'sourceless result');
            var s3 = new vm.Script(text, { filename: 's3', produceCachedData: true });
            assert(s3.cachedDataProduced, 's3.cachedDataProduced');
            console.log('bytecode-verify: PASS');
          "
          echo "::endgroup::"

      - name: Rename to release contract name
        run: mv "docker-out/node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}" "${{ matrix.artifact }}"

      - name: Compute SHA-256
        run: sha256sum "${{ matrix.artifact }}" | tee "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Aggregate checksums (always runs after builds)
  # ─────────────────────────────────────────────────────────────────────
  checksums:
    name: Collect checksums
    needs: [build-native, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate combined CHECKSUMS.sha256
        run: |
          {
            echo "# Hakobu patched base binaries — Node ${{ env.NODE_VERSION }}"
            echo "# Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "#"
            echo "# Alpha targets (linuxstatic-arm64 excluded — blocked by toolchain)"
            echo ""
            find artifacts -name '*.sha256' -exec cat {} + | sort -k2
          } > CHECKSUMS.sha256

      - name: Display checksums
        run: cat CHECKSUMS.sha256

      - name: Upload combined checksums
        uses: actions/upload-artifact@v4
        with:
          name: CHECKSUMS
          path: CHECKSUMS.sha256
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Publish GitHub Release (only when publish_release=true)
  #
  # This job runs only on workflow_dispatch with publish_release=true,
  # and only if all build jobs succeeded. It:
  #   1. Downloads all verified build artifacts
  #   2. Generates CHECKSUMS.sha256
  #   3. Generates PROVENANCE.json from CI metadata
  #   4. Creates/replaces the GitHub Release at bases/node-v{nodeVersion}
  #   5. Uploads all assets
  # ─────────────────────────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [build-native, build-linux, checksums]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release directory
        run: |
          mkdir -p release

          # Flatten binaries (each is in its own artifact directory)
          for target in linux-x64 linux-arm64 win-x64 macos-arm64 macos-x64 linuxstatic-x64; do
            artifact="hakobu-base-${{ env.NODE_VERSION }}-${target}"
            cp "artifacts/${artifact}/${artifact}" release/
          done

          # Copy combined checksums
          cp artifacts/CHECKSUMS/CHECKSUMS.sha256 release/

          echo "::group::Release directory"
          ls -lh release/
          echo "::endgroup::"

      - name: Generate PROVENANCE.json
        run: |
          # Compute patch file hash
          PATCH_SHA=$(sha256sum packages/hakobu-fetch/patches/node.${{ env.NODE_VERSION }}.cpp.patch | cut -d' ' -f1)

          # Get Node source tarball hash from nodejs.org
          NODE_SRC_SHA=$(curl -sL "https://nodejs.org/dist/${{ env.NODE_VERSION }}/SHASUMS256.txt" \
            | grep "node-${{ env.NODE_VERSION }}.tar.gz$" | cut -d' ' -f1)

          # Read per-target SHA-256 from CHECKSUMS
          get_sha() { grep "$1" release/CHECKSUMS.sha256 | awk '{print $1}'; }

          # Generate PROVENANCE.json
          cat > release/PROVENANCE.json <<PROVEOF
          {
            "hakobuFetchVersion": "0.1.0",
            "nodeVersion": "${NODE_VERSION#v}",
            "nodeSourceUrl": "https://nodejs.org/dist/${{ env.NODE_VERSION }}/node-${{ env.NODE_VERSION }}.tar.gz",
            "nodeSourceSha256": "${NODE_SRC_SHA}",
            "patchFiles": ["node.${{ env.NODE_VERSION }}.cpp.patch"],
            "patchSetSha256": "${PATCH_SHA}",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "ciRunId": "${{ github.run_id }}",
            "ciRunUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "ciWorkflow": "${{ github.workflow }}",
            "ciCommit": "${{ github.sha }}",
            "ltoEnabled": false,
            "targets": [
              {
                "name": "hakobu-base-${{ env.NODE_VERSION }}-linux-x64",
                "platform": "linux", "arch": "x64", "tier": 1,
                "buildStrategy": "docker-native",
                "buildEnvironment": "OracleLinux 8, gcc-toolset-13",
                "verificationMethod": "native",
                "sha256": "$(get_sha linux-x64)"
              },
              {
                "name": "hakobu-base-${{ env.NODE_VERSION }}-linux-arm64",
                "platform": "linux", "arch": "arm64", "tier": 1,
                "buildStrategy": "docker-native",
                "buildEnvironment": "OracleLinux 8, gcc-toolset-13, native arm64 runner",
                "verificationMethod": "native",
                "sha256": "$(get_sha linux-arm64)"
              },
              {
                "name": "hakobu-base-${{ env.NODE_VERSION }}-win-x64",
                "platform": "win", "arch": "x64", "tier": 1,
                "buildStrategy": "native",
                "buildEnvironment": "windows-latest, VS 2022",
                "verificationMethod": "native",
                "sha256": "$(get_sha win-x64)"
              },
              {
                "name": "hakobu-base-${{ env.NODE_VERSION }}-macos-arm64",
                "platform": "macos", "arch": "arm64", "tier": 1,
                "buildStrategy": "native",
                "buildEnvironment": "macos-latest, Apple Clang",
                "verificationMethod": "native",
                "sha256": "$(get_sha macos-arm64)"
              },
              {
                "name": "hakobu-base-${{ env.NODE_VERSION }}-macos-x64",
                "platform": "macos", "arch": "x64", "tier": 2,
                "buildStrategy": "cross-compile-rosetta",
                "buildEnvironment": "macos-latest (arm64), -arch x86_64",
                "verificationMethod": "rosetta",
                "sha256": "$(get_sha macos-x64)"
              },
              {
                "name": "hakobu-base-${{ env.NODE_VERSION }}-linuxstatic-x64",
                "platform": "linuxstatic", "arch": "x64", "tier": 2,
                "buildStrategy": "docker-native",
                "buildEnvironment": "Alpine 3.22, musl, fully-static",
                "verificationMethod": "native",
                "sha256": "$(get_sha linuxstatic-x64)"
              }
            ]
          }
          PROVEOF

          # Clean up indentation from heredoc
          python3 -c "
          import json, sys
          with open('release/PROVENANCE.json') as f:
              d = json.load(f)
          with open('release/PROVENANCE.json', 'w') as f:
              json.dump(d, f, indent=2)
              f.write('\n')
          "

          echo "::group::PROVENANCE.json"
          cat release/PROVENANCE.json
          echo "::endgroup::"

      - name: Delete existing release (if any)
        run: gh release delete "${{ env.RELEASE_TAG }}" --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --title "Base Binaries: Node ${{ env.NODE_VERSION }} (alpha)" \
            --notes "$(cat <<'NOTES'
          ## Hakobu patched base binaries — Node ${{ env.NODE_VERSION }}

          Automated release from CI run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          ### Targets

          | Artifact | Tier | Build | Verification |
          |---|---|---|---|
          | `hakobu-base-${{ env.NODE_VERSION }}-linux-x64` | 1 | Docker (OracleLinux 8) | native |
          | `hakobu-base-${{ env.NODE_VERSION }}-linux-arm64` | 1 | Docker (OracleLinux 8, arm64) | native |
          | `hakobu-base-${{ env.NODE_VERSION }}-win-x64` | 1 | native | native |
          | `hakobu-base-${{ env.NODE_VERSION }}-macos-arm64` | 1 | native | native |
          | `hakobu-base-${{ env.NODE_VERSION }}-macos-x64` | 2 | cross (Rosetta) | Rosetta |
          | `hakobu-base-${{ env.NODE_VERSION }}-linuxstatic-x64` | 2 | Docker (Alpine) | native |

          **Excluded:** `linuxstatic-arm64` (muslcc GCC C++20 incompatibility)

          See `PROVENANCE.json` and `CHECKSUMS.sha256` for full build details.
          NOTES
          )" \
            release/hakobu-base-${{ env.NODE_VERSION }}-* \
            release/CHECKSUMS.sha256 \
            release/PROVENANCE.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release assets
        run: |
          echo "::group::Release assets"
          gh release view "${{ env.RELEASE_TAG }}" --json assets --jq '.assets[].name' | sort
          echo "::endgroup::"

          asset_count=$(gh release view "${{ env.RELEASE_TAG }}" --json assets --jq '.assets | length')
          echo "Total assets: $asset_count"
          if [ "$asset_count" -ne 8 ]; then
            echo "::error::Expected 8 assets (6 binaries + CHECKSUMS + PROVENANCE), got $asset_count"
            exit 1
          fi
          echo "Asset count: PASS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
