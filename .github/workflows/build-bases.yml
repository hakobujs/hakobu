name: Build Base Binaries

# Build patched Node v24.14.0 base binaries for all alpha-required targets.
# See docs/target-policy.md for the full target matrix and verification rules.
# See docs/release-contract.md for artifact naming and checksum format.
#
# This workflow is CI proof — it builds, verifies, and uploads artifacts.
# It does NOT publish GitHub Releases (that is Task 13 scope).
#
# Alpha-required targets (must be green):
#   Tier 1: linux-x64, linux-arm64, win-x64, macos-arm64
#   Tier 2: macos-x64, linuxstatic-x64
#
# Blocked targets (explicitly excluded):
#   linuxstatic-arm64: muslcc GCC too old for Node 24 deps/ada/ada.h
#                      C++20 constexpr (see docs/target-policy.md)
#
# Build strategy by target:
#   NATIVE RUNNERS (build directly on the runner via hakobu-fetch CLI):
#     macos-arm64:  native build + native verify on macos-latest (arm64)
#     macos-x64:    cross-build + Rosetta verify on macos-latest (arm64)
#     win-x64:      native build + native verify on windows-latest
#
#   DOCKER BUILDS (intentional — for glibc/musl output compatibility):
#     linux-x64:         OracleLinux 8 Docker on ubuntu-latest (glibc 2.28)
#     linux-arm64:       OracleLinux 8 Docker on ubuntu-24.04-arm (glibc 2.28, native arm64)
#     linuxstatic-x64:   Alpine 3.22 Docker on ubuntu-latest (musl, fully static)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/hakobu-fetch/**"
      - ".github/workflows/build-bases.yml"

env:
  NODE_RANGE: node24
  NODE_VERSION: v24.14.0

concurrency:
  group: build-bases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Native runner builds — macOS (arm64, x64) and Windows (x64)
  #
  # These targets build Node from source directly on the runner using
  # the hakobu-fetch CLI. No Docker needed.
  # ─────────────────────────────────────────────────────────────────────
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 1: native build, native verification
          - target: macos-arm64
            os: macos-latest
            platform: macos
            arch: arm64
            tier: 1
            artifact: hakobu-base-v24.14.0-macos-arm64

          # Tier 2: cross-build via -arch x86_64, Rosetta verification
          - target: macos-x64
            os: macos-latest
            platform: macos
            arch: x64
            tier: 2
            artifact: hakobu-base-v24.14.0-macos-x64

          # Tier 1: native build, native verification
          - target: win-x64
            os: windows-latest
            platform: win
            arch: x64
            tier: 1
            artifact: hakobu-base-v24.14.0-win-x64

    name: "${{ matrix.target }} (Tier ${{ matrix.tier }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build hakobu-fetch TypeScript
        run: pnpm --filter @hakobu/hakobu-fetch build

      - name: Build patched Node base binary
        working-directory: packages/hakobu-fetch
        shell: bash
        run: >
          node lib-es5/bin.js
          --node-range ${{ env.NODE_RANGE }}
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --force-build
          --output dist

      # ── macos-x64 Rosetta gate ──
      - name: Check Rosetta availability (macos-x64 only)
        if: matrix.target == 'macos-x64'
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::error::Rosetta 2 is not available on this runner."
            exit 1
          fi
          echo "Rosetta 2: available"

      - name: Verify — version + bytecode
        working-directory: packages/hakobu-fetch
        shell: bash
        run: |
          binary="dist/node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}"

          run_prefix=""
          if [ "${{ matrix.target }}" = "macos-x64" ]; then
            run_prefix="arch -x86_64"
          fi

          echo "::group::Binary info"
          ls -lh "$binary"
          file "$binary" || true
          echo "::endgroup::"

          echo "::group::Version + ABI check"
          PKG_EXECPATH=PKG_INVOKE_NODEJS $run_prefix "$binary" -e "
            var assert = require('assert');
            var v = process.version;
            var m = process.versions.modules;
            console.log('version:', v, '  ABI:', m, '  arch:', process.arch);
            assert(v.startsWith('v24.'), 'Expected v24.x, got ' + v);
            assert(m === '137', 'Expected ABI 137, got ' + m);
            console.log('version-check: PASS');
          "
          echo "::endgroup::"

          echo "::group::V8 bytecode (sourceless cachedData)"
          PKG_EXECPATH=PKG_INVOKE_NODEJS $run_prefix "$binary" -e "
            var vm = require('vm');
            var assert = require('assert');
            var text = '(function () { return 42; })';
            var s1 = new vm.Script(text, { filename: 's1', produceCachedData: true, sourceless: true });
            assert(s1.cachedDataProduced, 's1.cachedDataProduced');
            var s2 = new vm.Script(undefined, { filename: 's2', cachedData: s1.cachedData, sourceless: true });
            assert.equal(s2.runInThisContext()(), 42, 'sourceless result');
            var s3 = new vm.Script(text, { filename: 's3', produceCachedData: true });
            assert(s3.cachedDataProduced, 's3.cachedDataProduced');
            console.log('bytecode-verify: PASS');
          "
          echo "::endgroup::"

      - name: Rename to release contract name
        working-directory: packages/hakobu-fetch
        shell: bash
        run: mv "dist/node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}" "${{ matrix.artifact }}"

      - name: Compute SHA-256
        working-directory: packages/hakobu-fetch
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "${{ matrix.artifact }}" | tee "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" | tee "${{ matrix.artifact }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/hakobu-fetch/${{ matrix.artifact }}*
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Docker-based Linux builds (intentional — for output compatibility)
  #
  # These targets use Docker intentionally, NOT because Docker is the
  # only way to build, but because the Docker base image controls the
  # output binary's glibc/musl linkage:
  #
  #   linux-x64:       OracleLinux 8 → glibc 2.28 (broad compat)
  #   linux-arm64:     OracleLinux 8 → glibc 2.28 (broad compat, native arm64 runner)
  #   linuxstatic-x64: Alpine 3.22  → musl (fully static binary)
  #
  # TypeScript is pre-built on the CI runner using pnpm (frozen lockfile)
  # for deterministic compilation. Docker receives the pre-built lib-es5/
  # and only installs production runtime deps.
  #
  # linux-arm64 runs on a native arm64 runner (ubuntu-24.04-arm) so both
  # Docker compilation and verification are native — no cross-compile, no
  # QEMU. This is the target-policy escalation from alpha QEMU to native.
  #
  # NOTE: linuxstatic-arm64 is excluded. See target-policy.md.
  # ─────────────────────────────────────────────────────────────────────
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 1: OracleLinux 8 Docker, native x64 runner, native verify
          - target: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            tier: 1
            dockerfile: Dockerfile.linux
            extra_build_args: ""
            artifact: hakobu-base-v24.14.0-linux-x64

          # Tier 1: OracleLinux 8 Docker, NATIVE ARM64 RUNNER, native verify
          - target: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            tier: 1
            dockerfile: Dockerfile.linux
            extra_build_args: ""
            artifact: hakobu-base-v24.14.0-linux-arm64

          # Tier 2: Alpine Docker, native x64 runner, native verify (static binary)
          - target: linuxstatic-x64
            os: ubuntu-latest
            platform: linuxstatic
            arch: x64
            tier: 2
            dockerfile: Dockerfile.alpine
            extra_build_args: >-
              --build-arg HAKOBU_FETCH_OPTION_p=linuxstatic
              --build-arg HAKOBU_FETCH_OPTION_a=x64
            artifact: hakobu-base-v24.14.0-linuxstatic-x64

    name: "${{ matrix.target }} (Tier ${{ matrix.tier }})"
    runs-on: ${{ matrix.os }}
    # Docker-in-Docker Node compilation takes ~1.5-4h depending on target.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      # Pre-build TypeScript on the runner for deterministic compilation.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Pre-build hakobu-fetch TypeScript
        run: pnpm --filter @hakobu/hakobu-fetch build

      - name: Build in Docker and extract binary
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f packages/hakobu-fetch/${{ matrix.dockerfile }} \
            --output type=local,dest=docker-out \
            --build-arg HAKOBU_FETCH_OPTION_n=${{ env.NODE_RANGE }} \
            ${{ matrix.extra_build_args }} \
            packages/hakobu-fetch
          ls -lh docker-out/

      - name: Verify — version + bytecode
        run: |
          binary="docker-out/node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}"
          chmod +x "$binary"

          echo "::group::Binary info"
          ls -lh "$binary"
          file "$binary"
          echo "::endgroup::"

          echo "::group::Version + ABI check"
          PKG_EXECPATH=PKG_INVOKE_NODEJS "$binary" -e "
            var assert = require('assert');
            var v = process.version;
            var m = process.versions.modules;
            console.log('version:', v, '  ABI:', m, '  arch:', process.arch);
            assert(v.startsWith('v24.'), 'Expected v24.x, got ' + v);
            assert(m === '137', 'Expected ABI 137, got ' + m);
            console.log('version-check: PASS');
          "
          echo "::endgroup::"

          echo "::group::V8 bytecode (sourceless cachedData)"
          PKG_EXECPATH=PKG_INVOKE_NODEJS "$binary" -e "
            var vm = require('vm');
            var assert = require('assert');
            var text = '(function () { return 42; })';
            var s1 = new vm.Script(text, { filename: 's1', produceCachedData: true, sourceless: true });
            assert(s1.cachedDataProduced, 's1.cachedDataProduced');
            var s2 = new vm.Script(undefined, { filename: 's2', cachedData: s1.cachedData, sourceless: true });
            assert.equal(s2.runInThisContext()(), 42, 'sourceless result');
            var s3 = new vm.Script(text, { filename: 's3', produceCachedData: true });
            assert(s3.cachedDataProduced, 's3.cachedDataProduced');
            console.log('bytecode-verify: PASS');
          "
          echo "::endgroup::"

      - name: Rename to release contract name
        run: mv "docker-out/node-${{ env.NODE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}" "${{ matrix.artifact }}"

      - name: Compute SHA-256
        run: sha256sum "${{ matrix.artifact }}" | tee "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Aggregate all checksums
  # ─────────────────────────────────────────────────────────────────────
  checksums:
    name: Collect checksums
    needs: [build-native, build-linux]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate combined CHECKSUMS.sha256
        run: |
          {
            echo "# Hakobu patched base binaries — Node ${{ env.NODE_VERSION }}"
            echo "# Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "#"
            echo "# Alpha targets (linuxstatic-arm64 excluded — blocked by toolchain)"
            echo ""
            find artifacts -name '*.sha256' -exec cat {} + | sort -k2
          } > CHECKSUMS.sha256

      - name: Display checksums
        run: cat CHECKSUMS.sha256

      - name: Upload combined checksums
        uses: actions/upload-artifact@v4
        with:
          name: CHECKSUMS
          path: CHECKSUMS.sha256
          retention-days: 30
