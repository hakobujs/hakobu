name: CI

# Hakobu CI — fast checks on PRs, deep fixture tests on main.
#
# Fast checks (every PR + push to main):
#   - install, build both packages
#   - config normalization unit tests
#   - fixture harness in node-only mode (no packaging, fast)
#
# Deep checks (push to main + manual):
#   - full fixture matrix on macOS, Linux, and Windows:
#     package every fixture and compare packaged output against
#     unpackaged Node output
#   - drift detection between packaged and unpackaged behavior
#
# The deep checks require a base binary for the host platform.
# The packager fetches it on first use from GitHub Releases.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".kiro/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".kiro/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Fast checks — runs on every PR and push
  # ────────────────────────────────────────────────────────────
  fast:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Config normalization tests
        run: node packages/hakobu/test/test-config.js

      - name: Fixtures (node-only, no packaging)
        run: node fixtures/run.js --node-only

  # ────────────────────────────────────────────────────────────
  # Deep checks — runs on main push and manual trigger
  # Packages each fixture and compares against unpackaged output
  # ────────────────────────────────────────────────────────────
  fixtures-macos:
    name: Fixtures (macOS arm64, packaged)
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Full fixture matrix (node + packaged)
        run: node fixtures/run.js

  fixtures-linux:
    name: Fixtures (Linux x64, packaged)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Full fixture matrix (node + packaged)
        run: node fixtures/run.js

  # ────────────────────────────────────────────────────────────
  # Windows — full packaged fixture matrix
  # Packages each fixture into a .exe and runs the comparison
  # harness. This is a v1 release gate.
  #
  # Future: extend with Playwright/Camoufox gate (Task 8.4)
  # ────────────────────────────────────────────────────────────
  fixtures-windows:
    name: Fixtures (Windows x64, packaged)
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Config tests
        run: node packages/hakobu/test/test-config.js

      - name: Full fixture matrix (node + packaged)
        run: node fixtures/run.js

  # ────────────────────────────────────────────────────────────
  # Release-candidate gate — single green/red signal for RC readiness
  #
  # This job runs AFTER all platform fixture jobs pass. It runs
  # the specialized verification tests (source maps, bytecode,
  # multi-target) that are not part of the fixture matrix.
  #
  # A commit is RC-ready when this job is green.
  # ────────────────────────────────────────────────────────────
  rc-gate:
    name: RC Gate
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [fast, fixtures-macos, fixtures-linux, fixtures-windows]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Source map verification
        run: node fixtures/test-sourcemap.js

      - name: Bytecode verification
        run: node fixtures/test-bytecode.js

      - name: Multi-target verification
        run: node fixtures/test-multi-target.js

      - name: Publish dry-run — @hakobu/hakobu-fetch
        working-directory: packages/hakobu-fetch
        run: |
          echo "::group::npm pack --dry-run"
          npm pack --dry-run 2>&1
          echo "::endgroup::"

          # Verify critical files are present
          PACK_LIST=$(npm pack --dry-run 2>&1)
          for required in "lib-es5/index.js" "lib-es5/expected-shas.json" "patches/patches.json"; do
            if ! echo "$PACK_LIST" | grep -q "$required"; then
              echo "::error::Missing required file in @hakobu/hakobu-fetch tarball: $required"
              exit 1
            fi
          done
          echo "hakobu-fetch tarball: OK"

      - name: Publish dry-run — @hakobu/hakobu
        working-directory: packages/hakobu
        run: |
          echo "::group::npm pack --dry-run"
          npm pack --dry-run 2>&1
          echo "::endgroup::"

          # Verify critical files are present
          PACK_LIST=$(npm pack --dry-run 2>&1)
          for required in "lib-es5/bin.js" "lib-es5/packager.js" "lib-es5/index.d.ts" "prelude/bootstrap.js"; do
            if ! echo "$PACK_LIST" | grep -q "$required"; then
              echo "::error::Missing required file in @hakobu/hakobu tarball: $required"
              exit 1
            fi
          done
          echo "hakobu tarball: OK"

      - name: RC summary
        run: |
          echo "## Release Candidate Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build & Unit Tests | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fixtures (macOS) | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fixtures (Linux) | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fixtures (Windows) | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source maps | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bytecode | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Multi-target | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Publish dry-run (hakobu-fetch) | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Publish dry-run (hakobu) | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**This commit is release-candidate ready.**" >> "$GITHUB_STEP_SUMMARY"
