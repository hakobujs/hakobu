name: Release

# Hakobu release workflow — publish npm packages and create GitHub Release.
#
# Trigger options:
#   1. Push a version tag:       git tag v0.2.0 && git push --tags
#   2. Manual workflow_dispatch: specify version in the UI
#
# What it does:
#   1. Validates the version tag/input
#   2. Runs build + tests + fixture matrix (same as CI deep checks)
#   3. Publishes @hakobu/hakobu-fetch to npm
#   4. Publishes @hakobu/hakobu to npm
#   5. Creates a GitHub Release with auto-generated changelog
#
# Prerequisites:
#   - NPM_TOKEN secret configured in the repository
#   - packages/hakobu/package.json version matches the release tag
#   - CI must be green before release (enforced by this workflow)
#
# How to cut a release:
#   1. Update version in both packages/hakobu/package.json and
#      packages/hakobu-fetch/package.json
#   2. Commit: git commit -am "chore: bump to v0.2.0"
#   3. Tag:    git tag v0.2.0
#   4. Push:   git push && git push --tags
#   5. The workflow runs automatically. Check the Actions tab.
#
# Or use workflow_dispatch:
#   1. Go to Actions → Release → Run workflow
#   2. Enter the version (e.g., 0.2.0)
#   3. Optionally check dry_run to skip actual publishing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0 — without 'v' prefix)"
        required: true
        type: string
      dry_run:
        description: "Dry run — build and test but don't publish"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  # ────────────────────────────────────────────────────────────
  # Determine version from tag or input
  # ────────────────────────────────────────────────────────────
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: extract version from tag (v0.2.0 → 0.2.0)
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            DRY_RUN="false"
          else
            # Manual: use input
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
            DRY_RUN="${{ inputs.dry_run }}"
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Release: $TAG (dry_run=$DRY_RUN)"

  # ────────────────────────────────────────────────────────────
  # Build, test, and validate before publishing
  # ────────────────────────────────────────────────────────────
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Config tests
        run: node packages/hakobu/test/test-config.js

      - name: Fixtures (node-only)
        run: node fixtures/run.js --node-only

      - name: Verify package versions match release
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          PKG_VER=$(node -e "console.log(require('./packages/hakobu/package.json').version)")
          FETCH_VER=$(node -e "console.log(require('./packages/hakobu-fetch/package.json').version)")

          echo "Release version: $VERSION"
          echo "@hakobu/hakobu version: $PKG_VER"
          echo "@hakobu/hakobu-fetch version: $FETCH_VER"

          if [ "$PKG_VER" != "$VERSION" ]; then
            echo "::error::@hakobu/hakobu version ($PKG_VER) does not match release ($VERSION)"
            exit 1
          fi

          if [ "$FETCH_VER" != "$VERSION" ]; then
            echo "::error::@hakobu/hakobu-fetch version ($FETCH_VER) does not match release ($VERSION)"
            exit 1
          fi

  # ────────────────────────────────────────────────────────────
  # Fixture matrix (packaged) on macOS — release-gating
  # ────────────────────────────────────────────────────────────
  fixtures:
    name: Fixtures (macOS, packaged)
    runs-on: macos-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Full fixture matrix (node + packaged)
        run: node fixtures/run.js

  # ────────────────────────────────────────────────────────────
  # Publish to npm
  # ────────────────────────────────────────────────────────────
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [prepare, validate, fixtures]
    if: needs.prepare.outputs.dry_run != 'true'
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish @hakobu/hakobu-fetch
        working-directory: packages/hakobu-fetch
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @hakobu/hakobu
        working-directory: packages/hakobu
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ────────────────────────────────────────────────────────────
  # Create GitHub Release
  # ────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    if: needs.prepare.outputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          gh release create "$TAG" \
            --title "Hakobu $TAG" \
            --generate-notes \
            --verify-tag \
            || gh release create "$TAG" \
              --title "Hakobu $TAG" \
              --generate-notes

  # ────────────────────────────────────────────────────────────
  # Dry run summary
  # ────────────────────────────────────────────────────────────
  dry-run-summary:
    name: Dry Run Summary
    runs-on: ubuntu-latest
    needs: [prepare, validate, fixtures]
    if: needs.prepare.outputs.dry_run == 'true'
    steps:
      - name: Summary
        run: |
          echo "## Dry Run Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ needs.prepare.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** ${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build, tests, and fixture matrix passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run without dry_run to publish." >> "$GITHUB_STEP_SUMMARY"
